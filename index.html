<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM & Menú Digital</title>

  <!-- Librerías visuales base (Tailwind + Iconos) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- CONEXIÓN AL ARCHIVO 2: ESTILOS VISUALES -->
  <link rel="stylesheet" href="estilos.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24">

  <!-- =========================================================
       BARRA SUPERIOR DE NAVEGACIÓN (PARA CAMBIAR ENTRE MÓDULOS)
  ========================================================== -->
  <header class="sticky top-0 z-40 bg-slate-900/95 border-b border-amber-500/30 px-3 py-2">
    <div class="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-2 text-xs">
      <div class="flex items-center gap-2">
        <span class="bg-amber-500 text-slate-950 font-extrabold px-2 py-0.5 rounded">CRM</span>
        <span id="indicador-voz" class="text-emerald-400 font-bold">
          <i class="fa-solid fa-volume-high"></i> Audio Activo
        </span>
      </div>

      <!-- Botones para cambiar entre la vista del Cliente y las áreas del Personal -->
      <nav class="flex flex-wrap gap-1">
        <button onclick="cambiarModuloPrincipal('vista-acceso')" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 font-bold">
          🔐 Acceso
        </button>
        <button onclick="cambiarModuloPrincipal('vista-cliente')" class="px-2.5 py-1 rounded-lg bg-amber-500 text-slate-950 font-extrabold">
          📱 Cliente (3 Zonas)
        </button>
        <button onclick="cambiarModuloPrincipal('vista-mesas')" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 font-bold">
          👨‍🍳 Mesas y Cocina
        </button>
        <button onclick="cambiarModuloPrincipal('vista-modos')" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 font-bold">
          🧠 3 Modos
        </button>
        <button onclick="cambiarModuloPrincipal('vista-plataformas')" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 font-bold">
          🛵 DiDi / Uber / Rappi
        </button>
        <button onclick="cambiarModuloPrincipal('vista-arqueo')" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 font-bold">
          💰 Arqueo Caja
        </button>
      </nav>
    </div>
  </header>

  <!-- =========================================================
       1. CONTENEDOR DE ACCESO, REGISTRO Y LOGIN
       (Lo controla: acceso_registro.js)
  ========================================================== -->
  <section id="vista-acceso" class="modulo-pantalla max-w-md mx-auto p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 text-center text-sm text-slate-400">
      Aquí cargará el módulo <strong>acceso_registro.js</strong> (Pregunta inicial, validación de 10 dígitos, sexo y ubicación).
    </div>
  </section>

  <!-- =========================================================
       2. CONTENEDOR DEL COMENSAL (DIVIDIDO EN LAS 3 ZONAS)
       (Lo controlan: perfil_cliente.js, tienda_menu.js, zona_descuentos.js, carrito_pagos.js)
  ========================================================== -->
  <main id="vista-cliente" class="modulo-pantalla max-w-md mx-auto p-4 hidden space-y-4">

    <!-- Cabecera de fila de espera y Semáforo con voz -->
    <div id="contenedor-semaforo"></div>

    <!-- Botonera de las 3 Zonas del Cliente -->
    <div class="grid grid-cols-3 gap-2 bg-slate-900 p-1.5 rounded-2xl border border-slate-800 text-xs font-extrabold">
      <button onclick="cambiarZonaCliente('zona-perfil')" id="btn-zona-perfil" class="py-2.5 rounded-xl text-slate-400">
        👤 Mi Perfil
      </button>
      <button onclick="cambiarZonaCliente('zona-tienda')" id="btn-zona-tienda" class="py-2.5 rounded-xl bg-amber-500 text-slate-950">
        🍔 Tienda
      </button>
      <button onclick="cambiarZonaCliente('zona-descuentos')" id="btn-zona-descuentos" class="py-2.5 rounded-xl text-slate-400">
        🏷️ Códigos
      </button>
    </div>

    <!-- ZONA 1: MI PERFIL -->
    <div id="zona-perfil" class="subzona-cliente hidden"></div>

    <!-- ZONA 2: TIENDA (MENÚ DIGITAL) -->
    <div id="zona-tienda" class="subzona-cliente"></div>

    <!-- ZONA 3: ZONA DE DESCUENTOS Y PROMOCIONES -->
    <div id="zona-descuentos" class="subzona-cliente hidden"></div>

    <!-- BANDEJA DEL CARRITO Y PAGOS (Bloqueado hasta que Mesas confirme) -->
    <div id="contenedor-carrito"></div>
  </main>

  <!-- =========================================================
       3. CONTENEDOR DE MESAS (DIGITAL MÁX 5 + FÍSICA 1x1) Y COCINA
       (Lo controla: mesas_tiempos.js)
  ========================================================== -->
  <section id="vista-mesas" class="modulo-pantalla max-w-3xl mx-auto p-4 hidden"></section>

  <!-- =========================================================
       4. CONTENEDOR DE LOS 3 MODOS (MANUAL, AUTOMÁTICO, HÍBRIDO)
       (Lo controla: modos_inteligencia.js)
  ========================================================== -->
  <section id="vista-modos" class="modulo-pantalla max-w-3xl mx-auto p-4 hidden"></section>

  <!-- =========================================================
       5. CONTENEDOR DE PLATAFORMAS EXTERNAS (DIDI, UBER, RAPPI)
       (Lo controla: plataformas_externas.js)
  ========================================================== -->
  <section id="vista-plataformas" class="modulo-pantalla max-w-3xl mx-auto p-4 hidden"></section>

  <!-- =========================================================
       6. CONTENEDOR DE ARQUEO DE CAJA AL FINAL DEL TURNO
       (Lo controla: arqueo_caja.js)
  ========================================================== -->
  <section id="vista-arqueo" class="modulo-pantalla max-w-3xl mx-auto p-4 hidden"></section>

  <!-- =========================================================
       7. CONTENEDOR FLOTANTE DE POP-UPS COMERCIALES Y MÉTRICAS
       (Lo controla: popups_metricas.js)
  ========================================================== -->
  <div id="contenedor-popups"></div>

  <!-- =========================================================
       NAVEGACIÓN BÁSICA DEL ESQUELETO
  ========================================================== -->
  <script>
    function cambiarModuloPrincipal(idVista) {
      document.querySelectorAll('.modulo-pantalla').forEach(sec => {
        sec.classList.toggle('hidden', sec.id !== idVista);
      });
    }

    function cambiarZonaCliente(idZona) {
      document.querySelectorAll('.subzona-cliente').forEach(z => {
        z.classList.toggle('hidden', z.id !== idZona);
      });
      ['zona-perfil', 'zona-tienda', 'zona-descuentos'].forEach(id => {
        const btn = document.getElementById('btn-' + id);
        if (btn) {
          btn.className = (id === idZona)
            ? 'py-2.5 rounded-xl bg-amber-500 text-slate-950 font-extrabold'
            : 'py-2.5 rounded-xl text-slate-400 font-bold';
        }
      });
    }
  </script>

  <!-- =========================================================
       LLAMADO A CADA UNO DE LOS ARCHIVOS POR SEPARADO
  ========================================================== -->
  <script src="conexion.js"></script>
  <script src="semaforo_voz.js"></script>
  <script src="acceso_registro.js"></script>
  <script src="perfil_cliente.js"></script>
  <script src="tienda_menu.js"></script>
  <script src="zona_descuentos.js"></script>
  <script src="carrito_pagos.js"></script>
  <script src="mesas_tiempos.js"></script>
  <script src="popups_metricas.js"></script>
  <script src="modos_inteligencia.js"></script>
  <script src="plataformas_externas.js"></script>
  <script src="arqueo_caja.js"></script>
</body>
</html>
